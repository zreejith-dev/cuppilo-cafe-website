<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — CUPPILO</title>
  <meta name="description" content="Explore the full CUPPILO menu. Vote for your favourites and set fair prices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .menu-page{padding-top:1rem;padding-bottom:4rem}
    .menu-search{display:flex;align-items:center;gap:.5rem;background:var(--bg-card);border:1px solid var(--muted);border-radius:.75rem;padding:.5rem .75rem;margin-bottom:1rem}
    .menu-search input{flex:1;border:none;background:none;font-family:inherit;font-size:.9375rem;color:var(--on-s);outline:none}
    .menu-search input::placeholder{color:var(--on-sv)}
    .menu-search .material-symbols-outlined{color:var(--on-sv);font-size:20px}

    .cat-scroll{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.75rem;margin-bottom:1.25rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .cat-scroll::-webkit-scrollbar{display:none}
    .cat-chip{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:9999px;font-size:.8125rem;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--chip-text);white-space:nowrap;flex-shrink:0}
    .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .cat-chip .count{font-size:.6875rem;opacity:.7}

    .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
    @media(max-width:640px){.menu-grid{grid-template-columns:1fr}}

    .item-card{background:var(--bg-card);border:1px solid var(--muted);border-radius:1rem;overflow:hidden;transition:all .3s}
    .item-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
    .item-img{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
    .item-img .badges{position:absolute;top:.5rem;left:.5rem;display:flex;gap:.25rem}
    .item-badge{padding:.125rem .5rem;border-radius:9999px;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .badge-veg{background:#2D6A4F;color:#fff}
    .badge-nonveg{background:#c62828;color:#fff}
    .badge-popular{background:var(--primary);color:#fff}
    .badge-signature{background:var(--brass);color:var(--charcoal)}
    .badge-premium{background:var(--charcoal);color:var(--brass)}

    .item-body{padding:1rem}
    .item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.375rem}
    .item-name{font-size:.9375rem;font-weight:700;color:var(--on-card)}
    .item-name-ml{font-size:.75rem;color:var(--brass);display:block;margin-bottom:.125rem}
    .item-price{font-size:1rem;font-weight:800;color:var(--primary);white-space:nowrap}
    .item-desc{font-size:.8125rem;color:var(--on-sv);line-height:1.5;margin-bottom:.75rem}

    .item-slider{margin-bottom:.5rem}
    .item-slider label{font-size:.6875rem;font-weight:600;color:var(--on-sv);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:.25rem}
    .item-slider input[type="range"]{width:100%}
    .slider-row{display:flex;align-items:center;gap:.5rem;margin-top:.25rem}
    .slider-val{font-weight:700;font-size:.875rem;color:var(--primary)}
    .slider-range{font-size:.6875rem;color:var(--on-sv)}

    .item-footer{display:flex;align-items:center;justify-content:space-between}
    .vote-btn{width:2.25rem;height:2.25rem;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;background:var(--chip-bg);cursor:pointer;transition:all .2s;color:var(--on-sv);font-size:1.125rem}
    .vote-btn.active{color:var(--primary)}
    .vote-btn:active{transform:scale(1.2)}
    .vote-count{font-size:.75rem;color:var(--on-sv)}

    .sticky-ballot{position:fixed;bottom:0;left:0;right:0;background:var(--bar-bg);border-top:1px solid var(--nav-border);z-index:100;padding:.75rem 0}
    .sticky-inner{display:flex;justify-content:space-between;align-items:center}

    .empty-menu{text-align:center;padding:3rem 1rem;color:var(--on-sv)}
    .empty-menu .material-symbols-outlined{font-size:48px;margin-bottom:.5rem;opacity:.5}
  </style>
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <main class="menu-page">
    <div class="container">

      <!-- Search -->
      <div class="menu-search">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="menu-search" placeholder="Search menu..." data-en="Search menu..." data-ml="മെനു തിരയുക...">
      </div>

      <!-- Category Filter -->
      <div class="cat-scroll" id="cat-scroll"></div>

      <!-- Menu Grid -->
      <div class="menu-grid" id="menu-grid"></div>

      <!-- Empty State -->
      <div class="empty-menu" id="empty-menu" style="display:none">
        <span class="material-symbols-outlined">search_off</span>
        <p data-en="No items found" data-ml="ഇനങ്ങൾ കണ്ടെത്തിയില്ല">No items found</p>
      </div>

    </div>
  </main>

  <!-- Sticky Ballot Bar -->
  <div class="sticky-ballot">
    <div class="container sticky-inner">
      <span style="font-size:.8125rem;color:var(--bar-text)">
        <strong id="vote-count">0</strong> / 5 <span data-en="votes cast" data-ml="വോട്ടുകൾ നൽകി">votes cast</span>
      </span>
      <a href="menu-ballot.html" class="btn btn-primary" style="padding:.5rem 1rem;font-size:.8125rem" data-en="Go to Ballot" data-ml="ബാലറ്റിലേക്ക് പോകുക">Go to Ballot</a>
    </div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/shared.js"></script>
  <script>
    let activeCategory = 'all';
    let votedItems = JSON.parse(localStorage.getItem('cuppilo_menu_votes') || '[]');
    let itemPrices = JSON.parse(localStorage.getItem('cuppilo_menu_prices') || '{}');

    // Render category chips
    function renderCategories() {
      const scroll = document.getElementById('cat-scroll');
      scroll.innerHTML = CATEGORIES.map(c => {
        const count = c.id === 'all' ? CUPPILO_MENU.length : CUPPILO_MENU.filter(i => i.cat === c.id).length;
        return '<button class="cat-chip' + (activeCategory === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' +
          c.emoji + ' ' + c.label + ' <span class="count">' + count + '</span></button>';
      }).join('');

      scroll.addEventListener('click', function(e) {
        const chip = e.target.closest('.cat-chip');
        if (!chip) return;
        activeCategory = chip.dataset.cat;
        renderCategories();
        renderMenu();
      });
    }

    // Render menu items
    function renderMenu() {
      const search = document.getElementById('menu-search').value.toLowerCase().trim();
      let items = CUPPILO_MENU;

      if (activeCategory !== 'all') {
        items = items.filter(i => i.cat === activeCategory);
      }
      if (search) {
        items = items.filter(i =>
          i.name.toLowerCase().includes(search) ||
          i.nameMl.includes(search) ||
          i.desc.toLowerCase().includes(search) ||
          i.cat.toLowerCase().includes(search)
        );
      }

      const grid = document.getElementById('menu-grid');
      const empty = document.getElementById('empty-menu');

      if (items.length === 0) {
        grid.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = items.map(item => {
        const voted = votedItems.includes(item.id);
        const savedPrice = itemPrices[item.id] || item.price;
        const priceDiff = savedPrice - item.price;
        const priceLabel = priceDiff > 0 ? '+' + priceDiff : priceDiff < 0 ? priceDiff : '';

        let badges = '';
        if (item.veg) badges += '<span class="item-badge badge-veg">VEG</span>';
        else badges += '<span class="item-badge badge-nonveg">NON-VEG</span>';
        if (item.popular) badges += '<span class="item-badge badge-popular">Popular</span>';
        if (item.signature) badges += '<span class="item-badge badge-signature">Signature</span>';
        else if (item.premium) badges += '<span class="item-badge badge-premium">Premium</span>';

        return '<div class="item-card" data-id="' + item.id + '">' +
          '<div class="item-img" style="background:linear-gradient(135deg,' + item.gradient + ')">' +
            '<span>' + item.emoji + '</span>' +
            '<div class="badges">' + badges + '</div>' +
          '</div>' +
          '<div class="item-body">' +
            '<div class="item-header">' +
              '<div>' +
                '<span class="item-name-ml">' + item.nameMl + '</span>' +
                '<div class="item-name">' + item.name + '</div>' +
              '</div>' +
              '<span class="item-price">₹' + item.price + '</span>' +
            '</div>' +
            '<p class="item-desc">' + item.desc + '</p>' +
            '<div class="item-slider">' +
              '<label data-en="Your Price" data-ml="നിങ്ങളുടെ വില">Your Price</label>' +
              '<input type="range" min="' + Math.max(10, item.price - 30) + '" max="' + (item.price + 50) + '" step="5" value="' + savedPrice + '" oninput="setPrice(\'' + item.id + '\',this.value,' + item.price + ')">' +
              '<div class="slider-row">' +
                '<span class="slider-val" id="price-' + item.id + '">₹' + savedPrice + '</span>' +
                '<span class="slider-range">₹' + Math.max(10, item.price - 30) + ' — ₹' + (item.price + 50) + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="item-footer">' +
              '<button class="vote-btn' + (voted ? ' active' : '') + '" onclick="toggleVote(\'' + item.id + '\')">' + (voted ? '❤️' : '🤍') + '</button>' +
              '<span class="vote-count">' + (voted ? 'Voted' : 'Tap to vote') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function setPrice(id, val, basePrice) {
      document.getElementById('price-' + id).textContent = '₹' + val;
      itemPrices[id] = parseInt(val);
      localStorage.setItem('cuppilo_menu_prices', JSON.stringify(itemPrices));
    }

    function toggleVote(id) {
      const idx = votedItems.indexOf(id);
      if (idx > -1) {
        votedItems.splice(idx, 1);
      } else {
        if (votedItems.length >= 5) {
          showToast('Maximum 5 votes allowed', 'error');
          return;
        }
        votedItems.push(id);
      }
      localStorage.setItem('cuppilo_menu_votes', JSON.stringify(votedItems));
      document.getElementById('vote-count').textContent = votedItems.length;
      renderMenu();
    }

    // Search
    document.getElementById('menu-search').addEventListener('input', renderMenu);

    // Init
    document.addEventListener('DOMContentLoaded', function() {
      initPage('menu');
      renderCategories();
      renderMenu();
      document.getElementById('vote-count').textContent = votedItems.length;
    });
  </script>

</body>
</html>
