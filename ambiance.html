<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambiance & Interior — Cuppilo Café</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#1a1108] text-[#f5f0e8] min-h-screen font-sans">

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-[#1a1108]/90 backdrop-blur-sm border-b border-[#3d2c14]/40"></nav>

  <main class="pt-20 pb-24 max-w-5xl mx-auto px-4">

    <div id="progress-section" class="mb-8">
      <p class="text-sm text-[#c4a265] mb-2 font-medium">Step 2 of 4 &bull; Architectural Vision</p>
      <div class="w-full h-2 bg-[#3d2c14]/50 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-[#c4a265] to-[#e8c97a] rounded-full transition-all duration-500" style="width:50%"></div>
      </div>
    </div>

    <section class="mb-10 text-center">
      <h1 class="text-3xl md:text-5xl font-bold text-[#e8c97a] leading-tight mb-2">നടമുറ്റം മുതൽ വരാന്ത വരെ</h1>
      <p class="text-lg md:text-xl text-[#c4a265]/80">Shape the Space &amp; Architectural Vibe</p>
    </section>

    <section id="moodboard-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">

      <label class="moodboard-card group relative rounded-2xl overflow-hidden cursor-pointer border-2 border-transparent hover:border-[#c4a265]/40 transition-all duration-300" data-option="A">
        <input type="radio" name="ambiance-choice" value="A" class="hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-[#5c3a1e] via-[#8b6914] to-[#3d2c14]"></div>
        <div class="relative p-5 md:p-6 flex flex-col h-full min-h-[320px]">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold uppercase tracking-wider bg-[#c4a265]/20 text-[#e8c97a] px-3 py-1 rounded-full">Option A</span>
            <div class="radio-icon w-6 h-6 rounded-full border-2 border-[#c4a265]/50 flex items-center justify-center transition-all">
              <div class="radio-dot w-3 h-3 rounded-full bg-[#e8c97a] scale-0 transition-transform"></div>
            </div>
          </div>
          <h3 class="text-xl md:text-2xl font-bold text-[#f5f0e8] mb-1">Kerala Heritage</h3>
          <p class="text-sm text-[#c4a265]/70 mb-4">Laterite, teak, brass, Edison lamps</p>
          <p class="text-sm text-[#f5f0e8]/70 mb-5 flex-1">Rooted in the warmth of Kerala's architectural soul — exposed laterite walls, hand-carved teak furniture, soft Edison glow, and brass accents that tell stories of time.</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <span class="chip text-xs bg-[#3d2c14]/60 text-[#c4a265] px-2 py-1 rounded-full border border-[#c4a265]/20">Laterite Stone</span>
            <span class="chip text-xs bg-[#3d2c14]/60 text-[#c4a265] px-2 py-1 rounded-full border border-[#c4a265]/20">Teak Wood</span>
            <span class="chip text-xs bg-[#3d2c14]/60 text-[#c4a265] px-2 py-1 rounded-full border border-[#c4a265]/20">Brass Fixtures</span>
            <span class="chip text-xs bg-[#3d2c14]/60 text-[#c4a265] px-2 py-1 rounded-full border border-[#c4a265]/20">Edison Lamps</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-[#c4a265]/60 vote-count">1,478 votes</span>
            <span class="text-xs font-bold text-[#e8c97a] vote-pct">38%</span>
          </div>
          <div class="w-full h-1.5 bg-[#3d2c14]/60 rounded-full overflow-hidden">
            <div class="consensus-bar h-full bg-[#c4a265] rounded-full transition-all duration-500" style="width:38%"></div>
          </div>
        </div>
      </label>

      <label class="moodboard-card group relative rounded-2xl overflow-hidden cursor-pointer border-2 border-[#c4a265] hover:border-[#e8c97a] transition-all duration-300 selected-halo" data-option="B">
        <input type="radio" name="ambiance-choice" value="B" class="hidden" checked>
        <div class="absolute inset-0 bg-gradient-to-br from-[#8b4513] via-[#cd853f] to-[#a0522d]"></div>
        <div class="absolute -inset-1 rounded-2xl border-2 border-[#e8c97a]/50 animate-pulse pointer-events-none z-10"></div>
        <div class="relative p-5 md:p-6 flex flex-col h-full min-h-[320px]">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold uppercase tracking-wider bg-[#e8c97a]/20 text-[#e8c97a] px-3 py-1 rounded-full">Option B</span>
              <span class="text-[10px] font-bold uppercase tracking-wider bg-[#c4a265] text-[#1a1108] px-2 py-0.5 rounded-full">Your Selection</span>
            </div>
            <div class="radio-icon w-6 h-6 rounded-full border-2 border-[#e8c97a] flex items-center justify-center bg-[#e8c97a]/20 transition-all">
              <div class="radio-dot w-3 h-3 rounded-full bg-[#e8c97a] scale-100 transition-transform"></div>
            </div>
          </div>
          <h3 class="text-xl md:text-2xl font-bold text-[#f5f0e8] mb-1">Earth &amp; Clay</h3>
          <p class="text-sm text-[#e8c97a]/80 mb-4">Terracotta, ceramics, bamboo, earth tones</p>
          <p class="text-sm text-[#f5f0e8]/70 mb-5 flex-1">Grounded in the raw beauty of earth — terracotta tiles, hand-thrown ceramics, bamboo screens, and a palette drawn straight from the soil beneath our feet.</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <span class="chip text-xs bg-[#cd853f]/30 text-[#f5f0e8] px-2 py-1 rounded-full border border-[#e8c97a]/30">Terracotta</span>
            <span class="chip text-xs bg-[#cd853f]/30 text-[#f5f0e8] px-2 py-1 rounded-full border border-[#e8c97a]/30">Ceramics</span>
            <span class="chip text-xs bg-[#cd853f]/30 text-[#f5f0e8] px-2 py-1 rounded-full border border-[#e8c97a]/30">Bamboo</span>
            <span class="chip text-xs bg-[#cd853f]/30 text-[#f5f0e8] px-2 py-1 rounded-full border border-[#e8c97a]/30">Earth Tones</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-[#c4a265]/60 vote-count">1,712 votes</span>
            <span class="text-xs font-bold text-[#e8c97a] vote-pct">44%</span>
          </div>
          <div class="w-full h-1.5 bg-[#3d2c14]/60 rounded-full overflow-hidden">
            <div class="consensus-bar h-full bg-[#e8c97a] rounded-full transition-all duration-500" style="width:44%"></div>
          </div>
        </div>
      </label>

      <label class="moodboard-card group relative rounded-2xl overflow-hidden cursor-pointer border-2 border-transparent hover:border-[#c4a265]/40 transition-all duration-300" data-option="C">
        <input type="radio" name="ambiance-choice" value="C" class="hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-[#4a4a4a] via-[#708090] to-[#2f4f4f]"></div>
        <div class="relative p-5 md:p-6 flex flex-col h-full min-h-[320px]">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold uppercase tracking-wider bg-[#708090]/30 text-[#b0c4de] px-3 py-1 rounded-full">Option C</span>
            <div class="radio-icon w-6 h-6 rounded-full border-2 border-[#708090]/50 flex items-center justify-center transition-all">
              <div class="radio-dot w-3 h-3 rounded-full bg-[#b0c4de] scale-0 transition-transform"></div>
            </div>
          </div>
          <h3 class="text-xl md:text-2xl font-bold text-[#f5f0e8] mb-1">Modern Tropical Minimal</h3>
          <p class="text-sm text-[#708090]/80 mb-4">Concrete, glass, clean lines</p>
          <p class="text-sm text-[#f5f0e8]/70 mb-5 flex-1">A contemporary retreat where tropical greenery meets minimalist architecture — polished concrete, floor-to-ceiling glass, and clean geometric lines.</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <span class="chip text-xs bg-[#4a4a4a]/60 text-[#b0c4de] px-2 py-1 rounded-full border border-[#708090]/30">Concrete</span>
            <span class="chip text-xs bg-[#4a4a4a]/60 text-[#b0c4de] px-2 py-1 rounded-full border border-[#708090]/30">Glass</span>
            <span class="chip text-xs bg-[#4a4a4a]/60 text-[#b0c4de] px-2 py-1 rounded-full border border-[#708090]/30">Clean Lines</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-[#c4a265]/60 vote-count">467 votes</span>
            <span class="text-xs font-bold text-[#b0c4de] vote-pct">12%</span>
          </div>
          <div class="w-full h-1.5 bg-[#3d2c14]/60 rounded-full overflow-hidden">
            <div class="consensus-bar h-full bg-[#708090] rounded-full transition-all duration-500" style="width:12%"></div>
          </div>
        </div>
      </label>

      <label class="moodboard-card group relative rounded-2xl overflow-hidden cursor-pointer border-2 border-transparent hover:border-[#c4a265]/40 transition-all duration-300" data-option="D">
        <input type="radio" name="ambiance-choice" value="D" class="hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-[#1a0a2e] via-[#2d1b4e] to-[#0f0f2d]"></div>
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_20%_30%,#e8c97a_0%,transparent_40%),radial-gradient(circle_at_80%_60%,#c4a265_0%,transparent_30%),radial-gradient(circle_at_50%_80%,#e8c97a_0%,transparent_35%)]"></div>
        <div class="relative p-5 md:p-6 flex flex-col h-full min-h-[320px]">
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold uppercase tracking-wider bg-[#2d1b4e]/80 text-[#d8b4fe] px-3 py-1 rounded-full">Option D</span>
            <div class="radio-icon w-6 h-6 rounded-full border-2 border-[#d8b4fe]/50 flex items-center justify-center transition-all">
              <div class="radio-dot w-3 h-3 rounded-full bg-[#d8b4fe] scale-0 transition-transform"></div>
            </div>
          </div>
          <h3 class="text-xl md:text-2xl font-bold text-[#f5f0e8] mb-1">Late Night Acoustic Courtyard</h3>
          <p class="text-sm text-[#d8b4fe]/80 mb-4">Fairy lights, lo-fi, floor cushions</p>
          <p class="text-sm text-[#f5f0e8]/70 mb-5 flex-1">An intimate after-hours hideaway — fairy lights strung across an open courtyard, lo-fi beats drifting through warm air, and low floor cushions for late-night conversations.</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <span class="chip text-xs bg-[#2d1b4e]/60 text-[#d8b4fe] px-2 py-1 rounded-full border border-[#d8b4fe]/20">Fairy Lights</span>
            <span class="chip text-xs bg-[#2d1b4e]/60 text-[#d8b4fe] px-2 py-1 rounded-full border border-[#d8b4fe]/20">Lo-Fi</span>
            <span class="chip text-xs bg-[#2d1b4e]/60 text-[#d8b4fe] px-2 py-1 rounded-full border border-[#d8b4fe]/20">Floor Cushions</span>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-[#c4a265]/60 vote-count">235 votes</span>
            <span class="text-xs font-bold text-[#d8b4fe] vote-pct">6%</span>
          </div>
          <div class="w-full h-1.5 bg-[#3d2c14]/60 rounded-full overflow-hidden">
            <div class="consensus-bar h-full bg-[#d8b4fe] rounded-full transition-all duration-500" style="width:6%"></div>
          </div>
        </div>
      </label>

    </section>

    <section class="mb-10 bg-[#3d2c14]/40 border border-[#c4a265]/20 rounded-2xl p-5 md:p-6">
      <div class="flex items-start gap-3">
        <div class="text-2xl mt-0.5">💡</div>
        <div>
          <h3 class="text-lg font-bold text-[#e8c97a] mb-1">Consensus Insight</h3>
          <p class="text-sm text-[#f5f0e8]/80 leading-relaxed">Terracotta &amp; Heritage are neck-and-neck! We are blending elements of both.</p>
        </div>
      </div>
    </section>

    <nav class="flex flex-col sm:flex-row gap-4 justify-between items-center">
      <a href="menu-ballot.html" class="w-full sm:w-auto text-center px-6 py-3 rounded-xl border border-[#c4a265]/30 text-[#c4a265] hover:bg-[#c4a265]/10 transition-all font-medium">
        &larr; Back to Menu Ballot
      </a>
      <a href="pricing.html" class="w-full sm:w-auto text-center px-6 py-3 rounded-xl bg-gradient-to-r from-[#c4a265] to-[#e8c97a] text-[#1a1108] font-bold hover:shadow-lg hover:shadow-[#c4a265]/20 transition-all">
        Continue to Fair Pricing &amp; Wishlist &rarr;
      </a>
    </nav>

  </main>

  <footer id="site-footer" class="border-t border-[#3d2c14]/40 py-6 mt-16"></footer>

  <script src="js/supabase-config.js"></script>
  <script src="js/shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.moodboard-card');

      function selectCard(card) {
        cards.forEach(c => {
          c.classList.remove('selected-halo');
          c.style.borderColor = '';
          const radio = c.querySelector('.radio-icon');
          const dot = c.querySelector('.radio-dot');
          const inp = c.querySelector('input[type="radio"]');
          if (radio) { radio.classList.remove('bg-[#e8c97a]/20'); radio.style.borderColor = ''; }
          if (dot) { dot.classList.remove('scale-100'); dot.classList.add('scale-0'); }
          if (inp) inp.checked = false;
          const badge = c.querySelector('.your-selection-badge');
          if (badge) badge.remove();
        });

        card.classList.add('selected-halo');
        card.style.borderColor = '#e8c97a';
        const radio = card.querySelector('.radio-icon');
        const dot = card.querySelector('.radio-dot');
        const inp = card.querySelector('input[type="radio"]');
        if (radio) { radio.classList.add('bg-[#e8c97a]/20'); radio.style.borderColor = '#e8c97a'; }
        if (dot) { dot.classList.remove('scale-0'); dot.classList.add('scale-100'); }
        if (inp) inp.checked = true;

        const headerArea = card.querySelector('.flex.items-center.justify-between.mb-4 .flex.items-center.gap-2, .flex.items-center.justify-between.mb-4 > span:first-child');
        if (headerArea && !card.querySelector('.your-selection-badge')) {
          const tag = document.createElement('span');
          tag.className = 'your-selection-badge text-[10px] font-bold uppercase tracking-wider bg-[#c4a265] text-[#1a1108] px-2 py-0.5 rounded-full';
          tag.textContent = 'Your Selection';
          headerArea.appendChild(tag);
        }
      }

      const defaultCard = document.querySelector('.moodboard-card[data-option="B"]');
      if (defaultCard) selectCard(defaultCard);

      cards.forEach(card => {
        card.addEventListener('click', () => selectCard(card));
      });
    });

    initPage('ambiance');
  </script>

</body>
</html>
